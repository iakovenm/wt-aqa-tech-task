name: Playwright Tests

# Lint and the API contract tests gate every push: they are deterministic and
# need no network beyond npm. The browser suite drives the live PayDo site,
# which refuses GitHub-hosted runners (every request lands on
# blocked.paydo.com), so it runs on request from a network PayDo serves and
# never fails the run. See "CI" in README.md.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run lint

  api:
    name: API contract tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No browser download: the API project runs against the bundled mock service.
      - name: Run tests
        run: npx playwright test --project=api
        env:
          CI: true
          WORKERS: 3
          RETRIES: 2

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            playwright-report/
            results.xml
          retention-days: 14
          if-no-files-found: ignore

  ui:
    name: UI tests (manual)
    runs-on: ubuntu-latest
    needs: lint
    # Manual only, and never red: on a hosted runner the ui-preflight project
    # detects the block and reports the reason in one line instead of a dozen
    # timeouts. Trigger it from a self-hosted runner on a served network to get
    # real coverage.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test --project=ui-chromium
        env:
          CI: true
          WORKERS: 3
          RETRIES: 2

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: |
            playwright-report/
            test-results/
            results.xml
          retention-days: 14
          if-no-files-found: ignore
